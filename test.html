<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>像素角色编辑器 - 全自动化测试套件</title>
  <style>
    body {
      background-color: #12121a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    h1 {
      color: #00d2ff;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .summary-card {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .metric {
      background: #1e1e2d;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      padding: 16px 24px;
      min-width: 120px;
    }
    .metric-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }
    .metric-val {
      font-size: 28px;
      font-weight: bold;
    }
    .val-pass { color: #00e676; }
    .val-fail { color: #ff5252; }
    .val-total { color: #00d2ff; }

    #log-container {
      background: #0d0d15;
      border: 1px solid #222233;
      border-radius: 8px;
      padding: 16px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .log-pass { color: #00e676; }
    .log-fail { color: #ff5252; font-weight: bold; }
    .log-info { color: #82aaff; }

    .btn-run {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-run:hover {
      background: #00b4db;
    }
    /* Hidden canvas container for test harness */
    #test-viewport {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 400px;
      height: 400px;
    }
  </style>
</head>
<body>
<p style="padding:16px;background:#243e58"><strong>这里是开发测试页，不是绘画界面。</strong> <a href="index.html" style="color:#8ee6ff">点击进入像素绘画工作台 →</a></p>
  <h1>🧪 像素角色编辑器 - 全自动化验证测试</h1>
  <p>验证内容：动作表素材导入 → 切帧识别 → 像素读取 → 像素越界拦截 → 锁定区域保护 → 多图层合成绘制 → 撤销重做 → 质量检查 → PNG 导出回读 100% 一致性。</p>

  <div class="summary-card">
    <div class="metric">
      <div class="metric-title">总用例数</div>
      <div id="stat-total" class="metric-val val-total">0</div>
    </div>
    <div class="metric">
      <div class="metric-title">测试通过</div>
      <div id="stat-pass" class="metric-val val-pass">0</div>
    </div>
    <div class="metric">
      <div class="metric-title">测试失败</div>
      <div id="stat-fail" class="metric-val val-fail">0</div>
    </div>
  </div>

  <button id="run-btn" class="btn-run" onclick="startTests()">▶ 重新执行全量测试</button>

  <div id="log-container">正在初始化测试环境并加载核心引擎...</div>

  <!-- 测试沙箱 DOM 结构 -->
  <div id="test-viewport">
    <canvas id="main-canvas" width="256" height="256"></canvas>
    <canvas id="preview-canvas" width="64" height="64"></canvas>
    <div id="sheet-list"></div>
    <div id="action-list"></div>
    <div id="frame-list"></div>
    <div id="layer-list"></div>
    <div id="palette-container"></div>
    <div id="status-bar"></div>
  </div>

  <!-- 脚本加载 -->
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/history.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/spritesheet.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/inspection.js"></script>
  <script src="js/export.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="test/test_suite.js"></script>

  <script>
    async function startTests() {
      const container = document.getElementById('log-container');
      container.innerHTML = '';

      const statTotal = document.getElementById('stat-total');
      const statPass = document.getElementById('stat-pass');
      const statFail = document.getElementById('stat-fail');

      const appendLog = (entry) => {
        const div = document.createElement('div');
        div.className = `log-${entry.status}`;
        div.textContent = entry.message;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      };

      const result = await window.runPixelEditorTests(appendLog);
      statTotal.textContent = result.total;
      statPass.textContent = result.passed;
      statFail.textContent = result.failed;
    }

    // 页面加载完成后自动执行一次
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        startTests();
      }, 300);
    });
  </script>
</body>
</html>
