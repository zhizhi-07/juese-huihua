<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自己画一件衣服 · 看它怎么贴</title>
<style>
  :root{
    --bg:#12141b; --panel:#1a1d27; --panel2:#212531; --line:#2c3141;
    --txt:#e2e6f0; --dim:#8a92a6; --dim2:#5f677a; --accent:#8fb4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:13px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1220px;margin:0 auto;padding:22px 20px 60px}
  h1{font-size:17px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 18px}
  .row{display:flex;gap:22px;align-items:flex-start}
  .boardbox{flex:none}
  #board{border:1px solid var(--line);border-radius:12px;background:#171a22;
    display:block;cursor:crosshair;touch-action:none}
  .hint{color:var(--dim2);font-size:11.5px;margin-top:8px;width:456px}
  .side{flex:1;min-width:0}
  .swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .sw{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:#fff}
  .sw.erase{background:#2a2f3d;display:flex;align-items:center;justify-content:center;
    color:#8a92a6;font-size:12px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:#3d4560}
  .btn.primary{background:#26406b;border-color:#41649e;color:#d6e4ff}
  .status{color:var(--dim);font-size:12px;margin-bottom:14px}
  #results{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}
  .card h3{margin:0 0 8px;font-size:11.5px;font-weight:500;color:var(--dim)}
  .pair{display:flex;gap:10px}
  .pair .one{flex:1;text-align:center}
  .pair canvas{display:block;margin:0 auto;image-rendering:pixelated;
    border-radius:6px;background:#171a22}
  .pair .one span{font-size:10.5px;color:var(--dim2)}
  .bad{color:#ff8f6b}
</style>
</head>
<body>
<div class="wrap">
  <h1>自己画一件衣服，看算法怎么把它贴到别的帧上</h1>
  <p class="sub">左边直接画在素体上——你画的每一格就是衣服。点"贴上去看看"，同一张衣服交给两套算法去贴别的身体。</p>

  <div id="msg" class="hint">读取素体中…</div>

  <div class="row" id="app" style="display:none">
    <div class="boardbox">
      <canvas id="board"></canvas>
      <div class="hint">左键画，右键擦。笔刷 1 格。颜色在右边选。</div>
    </div>
    <div class="side">
      <div class="swatches" id="swatches"></div>
      <div class="btns">
        <button class="btn primary" id="run">贴上去看看</button>
        <button class="btn" id="sample">示例衣服</button>
        <button class="btn" id="clear">清空重画</button>
        <button class="btn" id="undo">撤销一笔</button>
      </div>
      <div class="status" id="status"></div>
      <div id="results"></div>
    </div>
  </div>
</div>

<script>
'use strict';
const S=24;
const COLORS=['#e5e7eb','#9aa3b2','#4a5163','#1f2430','#e05c5c','#e8843c',
              '#e8c23c','#4c9a6a','#4aa3c8','#6c86d9','#a06cd9','#e08fb0'];
const OUTLINE=[70,70,94];

/* ---------- 基础像素操作 ---------- */
function blank(w,h){ return {width:w,height:h,data:new Uint8ClampedArray(w*h*4)}; }
function put(im,x,y,c){
  if(x<0||y<0||x>=im.width||y>=im.height) return;
  const i=(y*im.width+x)*4;
  im.data[i]=c[0];im.data[i+1]=c[1];im.data[i+2]=c[2];im.data[i+3]=255;
}
function isOutline(d,i){
  return Math.abs(d[i]-OUTLINE[0])<6 && Math.abs(d[i+1]-OUTLINE[1])<6 && Math.abs(d[i+2]-OUTLINE[2])<6;
}
function segsOf(im,y,skipOutline){
  const s=[]; let a=-1;
  for(let x=0;x<im.width;x++){
    const i=(y*im.width+x)*4;
    const ink = im.data[i+3]>0 && !(skipOutline && isOutline(im.data,i));
    if(ink){ if(a<0) a=x; }
    else if(a>=0){ s.push([a,x-1]); a=-1; }
  }
  if(a>=0) s.push([a,im.width-1]);
  return s;
}

/* ---------- 部位标记（自动，仅用于演示的"新算法"） ---------- */
function buildParts(im){
  const H=im.height, rows=[], inkRows=[];
  for(let y=0;y<H;y++){ rows.push(segsOf(im,y,true)); inkRows.push(segsOf(im,y,false)); }
  let topY=-1,bottomY=-1;
  for(let y=0;y<H;y++) if(inkRows[y].length){ if(topY<0) topY=y; bottomY=y; }
  if(topY<0) return null;
  let crotch=-1;
  const halfway=topY+Math.floor((bottomY-topY)*0.45);
  for(let q=Math.max(topY,halfway);q<=bottomY;q++){
    if(rows[q].length>=2){ crotch=q; break; }
  }
  const torso={y0:topY, y1:crotch>=0?crotch-1:bottomY, segs:{}};
  if(torso.y1>=torso.y0) for(let q=topY;q<=torso.y1;q++){
    let widest=null;
    for(const sg of rows[q]) if(!widest||(sg[1]-sg[0])>(widest[1]-widest[0])) widest=sg;
    if(widest) torso.segs[q]=widest;
  }
  let a=null,b=null;
  if(crotch>=0){
    a={y0:crotch,y1:crotch,segs:{}}; b={y0:crotch,y1:crotch,segs:{}};
    for(let q=crotch;q<=bottomY;q++){
      const sg=rows[q];
      if(sg.length>=1){ a.segs[q]=sg[0]; a.y1=q; }
      if(sg.length>=2){ b.segs[q]=sg[1]; b.y1=q; }
    }
    if(!Object.keys(b.segs).length) b=null;
  }
  return {topY,bottomY,crotch,torso,a,b,rows};
}
function partSpan(P,key){
  const p=P[key]; if(!p) return null;
  return {y0:p.y0,y1:p.y1,seg:(y)=>p.segs[y]||null};
}

/* ---------- 把"你画的像素"翻译成部位模型 ---------- */
function modelFromPainting(cloth, body){
  const P=buildParts(body);
  if(!P) return [];
  const model=[], H=body.height, W=body.width;
  const hasInk=(y)=> !!(P.rows[y] && P.rows[y].length);
  const nearestRow=(y)=>{
    if(hasInk(y)) return y;
    for(let d=1;d<H;d++){
      if(y+d<H && hasInk(y+d)) return y+d;
      if(y-d>=0 && hasInk(y-d)) return y-d;
    }
    return -1;
  };
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*cloth.width+x)*4;
    if(cloth.data[i+3]===0) continue;
    const c=[cloth.data[i],cloth.data[i+1],cloth.data[i+2],255];
    const ry=nearestRow(y);
    if(ry<0) continue;
    let part='torso', sg=P.torso.segs[ry];
    if(P.a && ry>=P.a.y0 && P.torso.y1<ry){
      const sa=P.a.segs[ry], sb=P.b?P.b.segs[ry]:null;
      if(sa&&sb) part = x<=(sa[1]+sb[0])/2 ? 'a' : 'b';
      else part = sb ? 'b' : 'a';
      sg = part==='a' ? sa : (sb||sa);
    } else if(!sg){
      sg = P.rows[ry][0];
    }
    if(!sg) continue;
    const pp=P[part]||P.torso;
    const hh=Math.max(1, pp.y1-pp.y0);
    const t=(ry-pp.y0)/hh;
    const u=(x-sg[0])/Math.max(1, sg[1]-sg[0]);
    model.push({c,kind:'paint',part,t,u});
  }
  return model;
}

/* ---------- 旧算法（原封不动复刻 clothing-fit.js） ---------- */
function rowsOld(im){
  const a=[];
  for(let y=0;y<im.height;y++){
    const xs=[];
    for(let x=0;x<im.width;x++){
      const i=(y*im.width+x)*4;
      if(im.data[i+3] && !isOutline(im.data,i)) xs.push(x);
    }
    if(xs.length) a.push({y,xs});
  }
  return a;
}
function fitOld(srcBody, cloth, tgtBody){
  const a=rowsOld(srcBody), b=rowsOld(tgtBody);
  const out=blank(tgtBody.width,tgtBody.height);
  for(let row=0;row<b.length;row++){
    const sr = row<2 ? row : Math.round(2+(row-2)*(a.length-3)/Math.max(1,b.length-3));
    const from=a[Math.min(a.length-1,Math.max(0,sr))];
    const to=b[row];
    if(!from||!to) continue;
    const mn=from.xs[0], mx=from.xs[from.xs.length-1];
    const lf=to.xs[0], rt=to.xs[to.xs.length-1];
    for(const x of to.xs){
      let sx=Math.round(mn+(x-lf)*(mx-mn)/Math.max(1,rt-lf));
      let i=(from.y*cloth.width+sx)*4;
      if(cloth.data[i+3]===0){
        const painted=from.xs.filter(px=>cloth.data[(from.y*cloth.width+px)*4+3]);
        if(!painted.length) continue;
        sx=painted.reduce((best,px)=>Math.abs(px-sx)<Math.abs(best-sx)?px:best);
        i=(from.y*cloth.width+sx)*4;
      }
      out.data.set(cloth.data.subarray(i,i+4),(to.y*out.width+x)*4);
    }
  }
  return out;
}

/* ---------- 新算法 ---------- */
function fitNew(model, body){
  const P=buildParts(body);
  const out=blank(body.width,body.height);
  if(!P) return out;
  const target={torso:partSpan(P,'torso'),a:partSpan(P,'a'),b:partSpan(P,'b')};
  for(const m of model){
    const p=target[m.part];
    if(!p) continue;
    // 纵向一律按这条记录自己的 t 落行，腿部也一样；否则一件短裤会被刷满整条腿。
    const rows=[Math.round(p.y0+m.t*(p.y1-p.y0))];
    for(const yy of rows){
      const seg=p.seg(yy); if(!seg) continue;
      let xx=Math.round(seg[0]+m.u*(seg[1]-seg[0]));
      xx=Math.min(Math.max(xx,seg[0]-2),seg[1]+2);
      put(out,xx,yy,m.c);
    }
  }
  return out;
}

/* ---------- 状态 ---------- */
let project=null, frames={};
let idle=null, walk=null, side=null, pick=null;
let painting=null;
let brush='#6c86d9';
let undoStack=[];

const board=document.getElementById('board');
const bx=board.getContext('2d');
const S2=5; // 结果图放大倍数

function keyColor(c){ return c; }

/* ---------- 画板 ---------- */
function drawBoard(){
  const w=idle.width,h=idle.height;
  board.width=w*S; board.height=h*S;
  board.style.width=(w*S)+'px'; board.style.height=(h*S)+'px';
  bx.imageSmoothingEnabled=false;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const px=x*S, py=y*S;
    let r=29,g=33,b=44;
    if(idle.data[i+3]>0){ r=idle.data[i]; g=idle.data[i+1]; b=idle.data[i+2]; }
    // 素体压暗，衣服亮出来
    const hasCloth = painting.data[(y*w+x)*4+3]>0;
    if(!hasCloth && idle.data[i+3]>0){ r=Math.round(r*0.55); g=Math.round(g*0.55); b=Math.round(b*0.55); }
    if(hasCloth){ r=painting.data[(y*w+x)*4]; g=painting.data[(y*w+x)*4+1]; b=painting.data[(y*w+x)*4+2]; }
    bx.fillStyle=`rgb(${r},${g},${b})`;
    bx.fillRect(px,py,S,S);
  }
  bx.strokeStyle='rgba(120,140,180,.14)';
  for(let x=0;x<=w;x++){ bx.beginPath(); bx.moveTo(x*S+.5,0); bx.lineTo(x*S+.5,h*S); bx.stroke(); }
  for(let y=0;y<=h;y++){ bx.beginPath(); bx.moveTo(0,y*S+.5); bx.lineTo(w*S,y*S+.5); bx.stroke(); }
}

function cellAt(ev){
  const r=board.getBoundingClientRect();
  return {x:Math.floor((ev.clientX-r.left)/S), y:Math.floor((ev.clientY-r.top)/S)};
}
function paint(ev,erase){
  const {x,y}=cellAt(ev);
  if(x<0||y<0||x>=idle.width||y>=idle.height) return;
  const i=(y*idle.width+x)*4;
  if(erase){ painting.data[i+3]=0; }
  else {
    const c=hexToRgb(brush);
    painting.data[i]=c[0];painting.data[i+1]=c[1];painting.data[i+2]=c[2];painting.data[i+3]=255;
  }
  drawBoard();
}
function hexToRgb(h){
  return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}
let drawing=false, drawErase=false;
board.addEventListener('pointerdown',e=>{
  e.preventDefault();
  undoStack.push(clonePainting());
  drawing=true; drawErase = (e.button===2) || brush==='ERASE';
  paint(e,drawErase);
  board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove',e=>{ if(drawing) paint(e,drawErase); });
board.addEventListener('pointerup',()=>{ drawing=false; });
board.addEventListener('contextmenu',e=>e.preventDefault());

function clonePainting(){
  return new Uint8ClampedArray(painting.data);
}

/* ---------- 结果 ---------- */
function renderResults(){
  const targetList=[
    {name:'同一副身体', body:idle},
    {name:'走路帧', body:walk},
    {name:'侧面', body:side},
    {name:'拾取帧', body:pick},
  ];
  const painted=countPainted();
  const model=modelFromPainting(painting,idle);
  const box=document.getElementById('results');
  box.innerHTML='';
  document.getElementById('status').innerHTML =
    `画了 <b>${painted}</b> 格 → 翻译成 <b>${model.length}</b> 条部位记录`;

  for(const t of targetList){
    const card=document.createElement('div'); card.className='card';
    const h=document.createElement('h3'); h.textContent=t.name; card.appendChild(h);
    const pair=document.createElement('div'); pair.className='pair';

    const neuOut=fitNew(model,t.body);
    const oldOut=fitOld(idle,painting,t.body);

    for(const [label,out,cls] of [['新（按部位）',neuOut,''],['旧（逐行横带）',oldOut,'bad']]){
      const one=document.createElement('div'); one.className='one';
      const cv=document.createElement('canvas');
      cv.width=t.body.width*S2; cv.height=t.body.height*S2;
      const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
      g.fillStyle='#171a22'; g.fillRect(0,0,cv.width,cv.height);
      // 底：素体
      for(let y=0;y<t.body.height;y++)for(let x=0;x<t.body.width;x++){
        const i=(y*t.body.width+x)*4;
        if(t.body.data[i+3]>0){
          g.fillStyle=`rgb(${t.body.data[i]},${t.body.data[i+1]},${t.body.data[i+2]})`;
          g.fillRect(x*S2,y*S2,S2,S2);
        }
      }
      // 上层：算法结果
      for(let y=0;y<out.height;y++)for(let x=0;x<out.width;x++){
        const i=(y*out.width+x)*4;
        if(out.data[i+3]>0){
          g.fillStyle=`rgb(${out.data[i]},${out.data[i+1]},${out.data[i+2]})`;
          g.fillRect(x*S2,y*S2,S2,S2);
        }
      }
      one.appendChild(cv);
      const sp=document.createElement('span');
      sp.className=cls; sp.textContent=label;
      one.appendChild(sp);
      pair.appendChild(one);
    }
    card.appendChild(pair);
    box.appendChild(card);
  }
}

function countPainted(){
  let n=0;
  for(let i=3;i<painting.data.length;i+=4) if(painting.data[i]>0) n++;
  return n;
}

/* ---------- 工具 ---------- */
function buildSwatches(){
  const box=document.getElementById('swatches');
  box.innerHTML='';
  COLORS.forEach(c=>{
    const d=document.createElement('div');
    d.className='sw'+(c===brush?' on':'');
    d.style.background=c; d.dataset.c=c;
    d.onclick=()=>{ brush=c; buildSwatches(); };
    box.appendChild(d);
  });
  const e=document.createElement('div');
  e.className='sw erase'; e.textContent='⌫';
  e.onclick=()=>{ brush='ERASE'; buildSwatches(); };
  box.appendChild(e);
}

document.getElementById('run').onclick=()=>{
  if(countPainted()===0){ alert('先画点东西'); return; }
  // 橡皮模式不算颜色
  renderResults();
};
document.getElementById('clear').onclick=()=>{
  undoStack.push(clonePainting());
  painting=blank(idle.width,idle.height);
  drawBoard(); document.getElementById('results').innerHTML='';
  document.getElementById('status').textContent='画布空了，随便涂。';
};
document.getElementById('undo').onclick=()=>{
  const prev=undoStack.pop();
  if(prev){ painting.data.set(prev); drawBoard(); }
};
document.getElementById('sample').onclick=()=>{ drawSample(); };

/* 示例：背心 + 腰带 + 短裤 */
function drawSample(){
  const P=buildParts(idle);
  if(!P){ return; }
  undoStack.push(clonePainting());
  painting=blank(idle.width,idle.height);
  const T=P.torso;
  const vest=[0x6c,0x86,0xd9], vestDark=[0x4a,0x60,0xa8];
  const band=[0xe8,0xc2,0x3c], bandDark=[0xc9,0xa1,0x28];
  const shortC=[0xe0,0x8f,0xb0], shortDark=[0xb4,0x6d,0x8a];
  for(let y=T.y0;y<=T.y1-1;y++){
    const sg=T.segs[y]; if(!sg) continue;
    for(let x=sg[0];x<=sg[1];x++) put(painting,x,y,(x>=sg[1]-0?vestDark:vest));
  }
  { const sg=T.segs[T.y1]; if(sg) for(let x=sg[0];x<=sg[1];x++) put(painting,x,T.y1,(x>=sg[1]?bandDark:band)); }
  if(P.crotch>=0){
    for(const leg of [P.a,P.b]){
      if(!leg) continue;
      for(let y=P.crotch;y<=Math.min(P.bottomY,P.crotch+2);y++){
        const sg=leg.segs[y]; if(!sg) continue;
        for(let x=sg[0];x<=sg[1];x++) put(painting,x,y,(x>=sg[1]?shortDark:shortC));
      }
    }
  }
  drawBoard();
  renderResults();
}

/* ---------- 读素体 ---------- */
async function loadAll(){
  const res=await fetch('/api/project?id=main',{cache:'no-store'});
  if(!res.ok) throw new Error('接口 '+res.status);
  const p=await res.json();
  const fr={};
  for(const l of p.layers){
    if(l.name!=='body'||!l.frameData) continue;
    for(const [k,v] of Object.entries(l.frameData)) fr[k]=v;
  }
  return {project:p, frames:fr};
}
function decodeBody(sheetIdx,actionIdx,frameIdx){
  const key=`${sheetIdx}_${actionIdx}_${frameIdx}`;
  return new Promise((resolve,reject)=>{
    const entry=frames[key];
    if(!entry){ reject(new Error('没有这一帧 '+key)); return; }
    const sh=project.spriteSheets[sheetIdx];
    const img=new Image();
    img.onerror=()=>reject(new Error('解码失败'));
    img.onload=()=>{
      const w=sh.frameWidth,h=sh.frameHeight;
      const c=document.createElement('canvas'); c.width=w;c.height=h;
      const g=c.getContext('2d',{willReadFrequently:true});
      const pl=entry.placement||{x:0,y:0,w:img.width,h:img.height};
      g.drawImage(img,pl.x||0,pl.y||0,pl.w||img.width,pl.h||img.height);
      const im=blank(w,h); im.data.set(g.getImageData(0,0,w,h).data);
      resolve(im);
    };
    img.src=entry.dataURL;
  });
}

(async function(){
  try{
    const r=await loadAll();
    project=r.project; frames=r.frames;
    idle=await decodeBody(1,1,0);
    walk=await decodeBody(0,1,2);
    side=await decodeBody(1,0,0);
    pick=await decodeBody(2,1,0);
    painting=blank(idle.width,idle.height);
    document.getElementById('msg').textContent='';
    document.getElementById('app').style.display='';
    buildSwatches(); drawBoard();
    document.getElementById('status').textContent='画布空的。可以直接画，也可以点"示例衣服"。';
    document.getElementById('results').innerHTML='';
  }catch(e){
    document.getElementById('msg').innerHTML='<span class="bad">读取失败：'+e.message+'</span>';
    console.error(e);
  }
})();
</script>
</body>
</html>
