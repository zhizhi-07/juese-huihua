<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景拼装器</title><link rel="stylesheet" href="css/scene-assembler.css?v=touch-pixels-manual-save-2"></head>
<body>
<header><strong>场景拼装器</strong><select id="projects" aria-label="当前素材工程"></select><button id="save">保存场景 · Ctrl+S</button><button id="refresh">更新源素材</button><button id="backup">下载可编辑备份</button><a id="editor" target="_blank" rel="noopener">打开绘画编辑器</a><span id="status" role="status" aria-live="polite">正在读取…</span></header>
<main><aside><h2>工程素材</h2><p>鼠标拖到场景；手机上下滑动找素材，轻点选中后点画布放置。</p><div id="materials"></div></aside>
<section id="workspace"><nav aria-label="场景操作">
<button id="undo">撤销</button><button id="redo">重做</button><button id="copy">复制</button><button id="delete">删除</button><button id="flip">水平翻转</button><button id="back">后移一层</button><button id="front">前移一层</button>
<label>物件版本 <select id="variant" aria-label="物件版本"></select></label><button id="play">暂停动画</button><button id="pan" aria-pressed="false">拖动画布</button>
<button id="out" aria-label="缩小画布">−</button><output id="zoom">400%</output><button id="in" aria-label="放大画布">＋</button><button id="fit">居中适配</button>
<label><input id="snap" type="checkbox">网格吸附</label><label>网格 <input id="grid" type="number" min="1" max="128" value="8"> px</label>
<label>宽 <input id="width" type="number" min="1" max="2048" value="160"></label><label>高 <input id="height" type="number" min="1" max="2048" value="128"></label><button id="resize">应用尺寸</button>
<button id="png">导出透明 PNG</button><button id="gif">导出 GIF</button>
</nav><div id="viewport"><canvas id="scene" tabindex="0" aria-label="场景画布：点击物件后拖动，方向键移动，Delete删除"></canvas></div><footer><span id="selection">未选中物件</span><span>整数像素 · 空白处或中键拖动画布 · 滚轮缩放 · Ctrl+D 复制 · Ctrl+Z 撤销</span></footer></section></main>
<script src="js/core.js"></script><script src="js/canvas.js"></script><script src="js/export.js"></script><script src="js/local-bridge.js"></script><script src="js/persistence.js"></script><script src="js/frame-timing.js"></script><script src="js/scene-assembly-model.js"></script><script src="js/scene-assembly-gif.js"></script><script src="js/scene-assembler.js?v=touch-pixels-manual-save-2"></script>
</body></html>
